<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabíola Góes Arquitetura | Apresentação Oficial do Site</title>
  
  <!-- Redirecionamento instantâneo para o link oficial na Vercel -->
  <meta http-equiv="refresh" content="0; url=https://arquitetafabiolagoes.vercel.app" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://arquitetafabiolagoes.vercel.app/assets/cropped-SIMBOLO-BEGE-42x42.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141615;
      color: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1C1E1D;
      border: 1px solid rgba(197, 168, 128, 0.35);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      width: 76px;
      height: 76px;
      margin-bottom: 24px;
      position: relative;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .spinner {
      position: absolute;
      inset: -6px;
      border: 2px solid transparent;
      border-top-color: #C5A880;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #FFFFFF;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #C5A880;
      font-weight: 600;
      margin-bottom: 24px;
    }
    p {
      font-size: 13px;
      color: #9EA3A0;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FAF8F5;
      color: #141615;
      padding: 14px 28px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      width: 100%;
    }
    .btn:hover {
      background: #F97316;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #666A67;
    }
  </style>

  <script>
    // Redirecionamento instantâneo via JavaScript
    window.location.replace("https://arquitetafabiolagoes.vercel.app");
  </script>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <div class="spinner"></div>
      <img src="https://arquitetafabiolagoes.vercel.app/assets/logo-marca-fg.png" alt="Fabíola Góes Arquitetura" />
    </div>

    <h1>Fabíola Goes</h1>
    <div class="subtitle">Arquitetura · Belém</div>

    <p>Carregando a apresentação interativa do novo site oficial...</p>

    <a href="https://arquitetafabiolagoes.vercel.app" class="btn">
      <span>Abrir Apresentação Interativa</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>

    <div class="footer-note">
      Se não redirecionar automaticamente em 2 segundos, clique no botão acima.
    </div>
  </div>

</body>
</html>
